<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Literal's icon: a pilcrow, the mark editors use for "show invisibles", followed by the
       pink block Literal paints over trailing whitespace. Sized to Apple's macOS icon grid:
       an 824px rounded square centred in a 1024px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8fd8"/>
      <stop offset="1" stop-color="#1f4f8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2a52" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101.500" y="101.500" width="821" height="821" rx="184.500" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#ink)" transform="translate(-40 0)">
    <path fill="#fdfdfc" d="M470 290 H716 V350 H680 V744 H618 V350 H566 V744 H504 V552 H470 A131 131 0 0 1 470 290 Z"/>
    <rect x="716" y="622" width="96" height="122" rx="12" fill="#f7b9b9"/>
  </g>
</svg>
